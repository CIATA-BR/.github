name: Relatar barreira de acessibilidade
description: Informe uma dificuldade de acesso, navegação, compreensão ou operação.
title: "[Acessibilidade]: "
labels:
  - accessibility
body:
  - type: markdown
    attributes:
      value: |
        Barreiras de acessibilidade são problemas funcionais. Não é necessário conhecer termos técnicos: descreva sua experiência com suas próprias palavras.

  - type: textarea
    id: barrier
    attributes:
      label: Qual barreira foi encontrada?
      placeholder: Descreva o que impediu ou dificultou a tarefa.
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: O que você estava tentando fazer?
      placeholder: Explique a tarefa e o resultado esperado.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Acesse...
        2. Navegue até...
        3. Execute...
        4. Observe...
    validations:
      required: true

  - type: input
    id: assistive_technology
    attributes:
      label: Tecnologia assistiva e versão
      description: Deixe em branco quando não se aplicar.
      placeholder: Exemplo: NVDA 2026.1, TalkBack 17 ou linha Braille Focus.

  - type: input
    id: platform
    attributes:
      label: Plataforma, aplicativo ou navegador
      placeholder: Exemplo: Android 16, Chrome 150 ou iOS 26.
    validations:
      required: true

  - type: dropdown
    id: navigation
    attributes:
      label: Forma principal de navegação
      options:
        - Leitor de tela com teclado
        - Leitor de tela por gestos
        - Linha Braille
        - Apenas teclado
        - Controle por voz
        - Ampliação ou zoom
        - Ponteiro ou toque
        - Outra
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Retorno recebido e retorno esperado
      description: Informe o que foi anunciado, exibido ou percebido e como deveria funcionar.

  - type: dropdown
    id: impact
    attributes:
      label: Impacto
      options:
        - Bloqueia completamente a tarefa
        - Exige ajuda de outra pessoa
        - Permite concluir com grande dificuldade
        - Causa confusão ou perda de tempo
        - É uma melhoria preventiva
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Informações adicionais
      description: Inclua logs sem dados sensíveis, gravações descritas em texto ou imagens com texto alternativo.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi dados pessoais, credenciais e informações sigilosas.
          required: true
