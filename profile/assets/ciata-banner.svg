<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">CIATA, tecnologia acessível, conhecimento compartilhado e impacto social</title>
  <desc id="desc">Banner institucional do CIATA com fundo azul-escuro, linhas conectando cinco núcleos que representam marca, design, engenharia, acessibilidade e conhecimento, além do lema Nenhum projeto começa do zero. Todo projeto deixa um legado.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A33"/>
      <stop offset="1" stop-color="#0B3B63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#41C7C7"/>
      <stop offset="1" stop-color="#8BE3C8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <path d="M0 286 C250 226 414 336 654 274 C878 216 1057 256 1280 188 L1280 360 L0 360 Z" fill="#0E5278" opacity="0.46"/>
  <path d="M0 320 C258 260 456 354 704 302 C928 255 1082 290 1280 236" fill="none" stroke="#41C7C7" stroke-width="2" opacity="0.35"/>

  <g transform="translate(72 66)">
    <text x="0" y="72" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="2">CIATA</text>
    <rect x="2" y="94" width="514" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="137" fill="#DDEBF5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Centro de Inclusão Através da Tecnologia Assistiva</text>
    <text x="0" y="184" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Tecnologia acessível. Conhecimento compartilhado.</text>
    <text x="0" y="222" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Impacto social.</text>
    <text x="0" y="268" fill="#BEEBE3" font-family="Arial, Helvetica, sans-serif" font-size="20">Nenhum projeto começa do zero. Todo projeto deixa um legado.</text>
  </g>

  <g transform="translate(850 76)" font-family="Arial, Helvetica, sans-serif">
    <path d="M164 102 L80 54 M164 102 L250 48 M164 102 L76 158 M164 102 L250 162" fill="none" stroke="#A7DCE8" stroke-width="3" opacity="0.72"/>

    <g transform="translate(128 66)">
      <circle cx="36" cy="36" r="42" fill="#FFFFFF" opacity="0.98"/>
      <text x="36" y="31" text-anchor="middle" fill="#082B48" font-size="17" font-weight="700">CIATA</text>
      <text x="36" y="52" text-anchor="middle" fill="#0B6C75" font-size="13" font-weight="700">WAY</text>
    </g>

    <g transform="translate(20 9)">
      <circle cx="36" cy="36" r="34" fill="#133F61" stroke="#73D6D0" stroke-width="3"/>
      <text x="36" y="40" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">MARCA</text>
    </g>
    <g transform="translate(250 4)">
      <circle cx="36" cy="36" r="34" fill="#133F61" stroke="#73D6D0" stroke-width="3"/>
      <text x="36" y="40" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">DESIGN</text>
    </g>
    <g transform="translate(14 132)">
      <circle cx="36" cy="36" r="34" fill="#133F61" stroke="#73D6D0" stroke-width="3"/>
      <text x="36" y="32" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">ENGENHARIA</text>
      <text x="36" y="48" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">DE SOFTWARE</text>
    </g>
    <g transform="translate(250 136)">
      <circle cx="36" cy="36" r="34" fill="#133F61" stroke="#73D6D0" stroke-width="3"/>
      <text x="36" y="33" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">ACESSIBILIDADE</text>
      <text x="36" y="49" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">DIGITAL</text>
    </g>
    <g transform="translate(128 218)">
      <circle cx="36" cy="36" r="34" fill="#133F61" stroke="#73D6D0" stroke-width="3"/>
      <text x="36" y="33" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">CONHECIMENTO</text>
      <text x="36" y="49" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">ABERTO</text>
    </g>
    <path d="M164 144 L164 218" fill="none" stroke="#A7DCE8" stroke-width="3" opacity="0.72"/>
  </g>
</svg>
